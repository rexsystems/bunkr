[package]
name = "bunkr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bunkr-proto = { path = "../proto" }
openmls = { version = "0.9", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = "0.6"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
zeroize = "1"
