[package]
name = "bunkr-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bunkr-core = { path = "../core" }
bunkr-proto = { path = "../proto" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement",
  "Storage", "Location", "Navigator", "Clipboard", "KeyboardEvent", "Event", "EventTarget",
  "Request", "RequestInit", "Response", "Headers", "WebSocket", "MessageEvent", "CloseEvent",
  "BinaryType", "RequestCache", "ScrollBehavior", "ScrollToOptions", "ScrollIntoViewOptions", "DomRect", "MediaQueryList",
] }

# Browser randomness for every crypto crate in the tree.
openmls = { version = "0.9", features = ["js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
