name: Desktop apps
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/web/**"
      - "crates/core/**"
      - ".github/workflows/desktop.yml"
      - "Cargo.toml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist

  desktop:
    needs: web
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-latest          # Intel Mac (cross-compiled)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest        # Windows on ARM (cross-compiled)
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Bunkr ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: bunkr-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: ignore

  android:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use the runner's Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
        working-directory: desktop
      - name: Generate Android project
        working-directory: desktop
        run: |
          npx tauri android init --ci
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO CAMERA MODIFY_AUDIO_SETTINGS POST_NOTIFICATIONS; do
            grep -q "permission.$p" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" "$M"
          done
          cat "$M"
      - name: Build APK
        working-directory: desktop
        run: npx tauri android build --apk
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(find desktop/src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          echo "unsigned: $APK"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            # No signing key configured yet: sign with a throwaway key so the
            # APK installs. Add ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD
            # secrets to get a stable key (needed for in-place updates).
            PASS=throwaway-$RANDOM$RANDOM
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias bunkr -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Bunkr"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --out bunkr-android.apk aligned.apk
          "$BT/apksigner" verify bunkr-android.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: bunkr-android
          path: bunkr-android.apk
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" bunkr-android.apk --clobber || true
